name: Emulator bootstrap diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap (${{ matrix.width }} px, sample ${{ matrix.sample }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {width: 720, height: 1600, density: 280, sample: 1}
          - {width: 720, height: 1600, density: 280, sample: 2}
          - {width: 360, height: 800, density: 140, sample: 1}
          - {width: 360, height: 800, density: 140, sample: 2}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe cold boot
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          emulator-build: 14472402
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          disk-size: 2048M
          emulator-port: 5554
          emulator-boot-timeout: 300
          pre-emulator-launch-script: printf 'hw.lcd.width=${{ matrix.width }}\nhw.lcd.height=${{ matrix.height }}\nhw.lcd.density=${{ matrix.density }}\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          disable-animations: false
          disable-spellchecker: true
          script: bash scripts/ci-emulator-probe.sh emulator-5554 cold
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: emulator-probe-${{ matrix.width }}-${{ matrix.sample }}
          retention-days: 7
          path: app/build/emulator-probe/
