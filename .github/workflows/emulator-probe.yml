name: Emulator macOS CPU diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap (QEMU ${{ matrix.cores }} CPUs)
    runs-on: macos-15-intel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cores: [4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: Create diagnostic output directory
        run: mkdir -p app/build/emulator-probe
      - name: Probe cold boot
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          emulator-build: 14472402
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072
          disk-size: 2048M
          emulator-port: 5554
          emulator-boot-timeout: 900
          pre-emulator-launch-script: printf 'hw.lcd.width=360\nhw.lcd.height=800\nhw.lcd.density=140\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back emulated -logcat '*:W' -logcat-output app/build/emulator-probe/early-logcat.txt -qemu -smp cores=${{ matrix.cores }}
          disable-animations: false
          disable-spellchecker: true
          script: bash scripts/ci-emulator-probe.sh emulator-5554 cold google_apis ${{ matrix.cores }}
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: emulator-cpu-${{ matrix.cores }}
          retention-days: 7
          path: app/build/emulator-probe/
